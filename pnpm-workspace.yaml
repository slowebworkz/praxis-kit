packages:
  - "packages/*"
  - "lib/*"
  - "adapters/*"
  - "plugins/*"
  - "tooling/*"
  - "qa/*"
  - "examples/*"

allowBuilds:
  "@ast-grep/cli": true
  esbuild: true
  unrs-resolver: true

catalog:
  # Core
  "@ast-grep/cli": ^0.45.3

  # Release
  "@changesets/cli": ^3.0.1

  # Playwright
  "@axe-core/playwright": ^4.13.0
  "@eslint/js": ^10.0.1
  "@playwright/experimental-ct-react": ^1.62.1
  "@playwright/experimental-ct-vue": ^1.62.1
  "@playwright/test": ^1.62.1

  # Preact
  "@preact/preset-vite": ^2.10.6
  "@solidjs/testing-library": ^0.8.10
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@testing-library/preact": ^3.2.4
  "@testing-library/svelte": ^5.4.2
  "@types/node": ^26.4.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@typescript-eslint/rule-tester": 8.68.0
  "@typescript-eslint/utils": 8.68.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitejs/plugin-vue": ^6.0.8
  "@vitest/ui": ^4.1.11
  "@vue/compiler-dom": ^3.5.42
  "@vue/server-renderer": ^3.5.42
  "@vue/test-utils": ^2.5.0
  class-variance-authority: ^0.7.1

  # Styling
  clsx: ^2.1.1
  dependency-cruiser: ^18.2.0
  eslint: ^10.9.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-boundaries: ^7.2.0
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-unicorn: ^73.0.0

  # Tooling
  husky: ^9.1.7

  jiti: ^2.7.0
  jscpd: ^4.2.4
  jsdom: ^29.0.0
  publint: ^0.3.24

  # Lit
  lit: ^3.3.3
  preact: ^10.29.8
  preact-render-to-string: ^6.7.0
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1

  # React
  react: ^19.2.8
  react-dom: ^19.2.8

  # Solid
  solid-js: ^1.9.15

  # Svelte
  svelte: ^5.57.0

  # Architecture tooling
  ts-morph: ^28.0.0
  tsdown: ^0.22.14
  tsx: ^4.23.13
  type-fest: ^5.9.0
  typescript: ^6.0.3
  typescript-eslint: 8.68.0
  vite: ^8.2.2
  vite-plugin-solid: ^2.11.14
  vitest: ^4.1.11
  vue: ^3.5.42

overrides:
  # Security-advisory floors. Verified against the GitHub Advisory DB on
  # 2026-08-31 — re-verify (not just bump) on each revisit:
  #   @babel/core      GHSA-4x5r-pxfx-6jf8  patched 7.29.6  (source-map file read)
  #   brace-expansion  GHSA-rgw5-rvv9-x895  patched 5.0.9   (unbounded-array DoS)
  #   esbuild          GHSA-g7r4-m6w7-qqqr  patched 0.28.1  (dev-server file read)
  #   postcss          GHSA-fxqj-rqcc-2cmp  patched 8.5.23  (sourceMappingURL .map read)
  #   undici           GHSA-4cwx-7wf7-3272  patched 7.29.0  (cross-user info disclosure)
  # Keep each floor >= its patched version.
  "@babel/core": "^7.29.7"
  "brace-expansion": ">=5.0.9"
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  typescript: ">=6 <7"
  undici: "^7.29.0"

peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>vite": "8"
    "@vitejs/plugin-vue>vite": "8"
