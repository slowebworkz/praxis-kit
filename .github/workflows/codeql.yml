name: CodeQL

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    # Every Monday at 03:17 UTC
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # `with:` values in a GitHub Actions workflow must be scalars — a YAML sequence here is
          # a schema violation of the workflow file itself, not just a wrong value for this
          # action's `languages` input (which the action's own docs specify as a comma-separated
          # string). This is why the previous, list-shaped version failed validation on *every*
          # push to *every* branch, not just main: GitHub's static parse of the workflow file
          # fails before it ever evaluates whether the push's branch matches `on.push.branches`,
          # so the run shows zero jobs and a generic "workflow file issue" regardless of branch.
          languages: javascript-typescript,actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
