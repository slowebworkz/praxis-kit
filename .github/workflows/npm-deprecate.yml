name: npm deprecate

# One-off / repeatable admin action: mark a range of published `praxis-kit` versions as
# deprecated (or clear the deprecation). Runs on the same `secrets.NPM_TOKEN` as Publish, so it
# needs no interactive `npm login` and leaves an audit trail in the Actions log.
#
# The `1.x`–`7.x` line predates this codebase — praxis-kit was rewritten and reset to `0.1.0`.
# Those versions can't be unpublished (npm blocks it past 72h) and their numbers are permanently
# spent regardless, so deprecation is the right tool: existing installs keep working but print a
# pointer to the current line.

on:
  workflow_dispatch:
    inputs:
      range:
        description: 'Semver range to act on (e.g. ">=1.0.0 <8.0.0"). Never include 0.1.0+.'
        required: true
        default: ">=1.0.0 <8.0.0"
      mode:
        description: "deprecate (set the notice) or undeprecate (clear it)"
        type: choice
        options:
          - deprecate
          - undeprecate
        default: deprecate
      message:
        description: "Deprecation message (ignored when mode = undeprecate)"
        required: true
        default:
          "This release is from an earlier codebase and is no longer maintained. praxis-kit was
          rewritten and reset — install the current line with `npm install praxis-kit@latest`."

permissions:
  contents: read

concurrency:
  group: npm-deprecate
  cancel-in-progress: false

jobs:
  deprecate:
    name: ${{ inputs.mode }} praxis-kit@${{ inputs.range }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Guard — the range must not touch the 0.x or 8.x+ line
        env:
          RANGE: ${{ inputs.range }}
        run: |
          if ! npx --yes semver@7 --range "$RANGE" 1.1.0 >/dev/null 2>&1; then
            echo "::error::Range '$RANGE' does not match 1.1.0 — is it a valid semver range covering the old line?"
            exit 1
          fi
          for v in 0.1.0 0.9.9 8.0.0 9.9.9; do
            if npx --yes semver@7 --range "$RANGE" "$v" >/dev/null 2>&1; then
              echo "::error::Range '$RANGE' matches $v — refusing (would deprecate the current or a future line)."
              exit 1
            fi
          done
          echo "Range OK: $RANGE (matches 1.1.0; excludes 0.x and 8.x+)"

      - name: Run
        env:
          RANGE: ${{ inputs.range }}
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ "$MODE" = "undeprecate" ]; then
            npm deprecate "praxis-kit@${RANGE}" ""
          else
            npm deprecate "praxis-kit@${RANGE}" "$MESSAGE"
          fi

      - name: Verify
        env:
          RANGE: ${{ inputs.range }}
        run: |
          echo "Deprecation state after the run:"
          npm view "praxis-kit@${RANGE}" version deprecated 2>&1 || true
